<div class="dg" data-diagram="t2-l6-merge-kinds"><div class="en"><svg id="dg-t2-l6-merge-kinds-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.000003814697265625 1185.0859375 976.0479125976562" style="width:100%;height:auto;max-width:1186px;--dg-w:1186px;direction:ltr" data-wide="1" role="img" aria-label="Flowchart of the four kinds of join and what each one does to the row count, measured on the real files. Five hundred and three listings meet a six-row city reference. The first and only question that matters is which key you join on. Joining on the raw city column matches three hundred and sixteen rows, because twenty-six spellings stand for five cities; joining on the cleaned name matches all five hundred and three. Under each key the four kinds then behave differently. An inner join keeps only matched rows: three hundred and sixteen on the raw key, which silently deletes one hundred and eighty-seven listings, or five hundred and three on the clean key, which deletes nothing. A left join keeps every listing and fills the reference columns with blanks where there was no match: five hundred and three rows either way, with one hundred and eighty-seven rows of blanks on the raw key. A right join keeps every reference row, so it adds Beit Lahia, a city with no listings, as one row of blanks. An outer join keeps both, giving five hundred and four rows. Beside all four sits the trap that is not a kind of join at all: if the key is not unique on the right, every matching left row is copied once per match, so four hundred and eighty flats against a reference whose Gaza row appears twice becomes six hundred and forty-four rows and a mean rent that moved from 211.05 to 223.59 shekels without a single cell changing. The defences are the same three every time: validate equals m colon 1, indicator equals True, and an assertion on the row count after the merge."><title>Flowchart of the four kinds of join and what each one does to the row count, measured on the real files. Five hundred and three listings meet a six-row city reference. The first and only question that matters is which key you join on. Joining on the raw city column matches three hundred and sixteen rows, because twenty-six spellings stand for five cities; joining on the cleaned name matches all five hundred and three. Under each key the four kinds then behave differently. An inner join keeps only matched rows: three hundred and sixteen on the raw key, which silently deletes one hundred and eighty-seven listings, or five hundred and three on the clean key, which deletes nothing. A left join keeps every listing and fills the reference columns with blanks where there was no match: five hundred and three rows either way, with one hundred and eighty-seven rows of blanks on the raw key. A right join keeps every reference row, so it adds Beit Lahia, a city with no listings, as one row of blanks. An outer join keeps both, giving five hundred and four rows. Beside all four sits the trap that is not a kind of join at all: if the key is not unique on the right, every matching left row is copied once per match, so four hundred and eighty flats against a reference whose Gaza row appears twice becomes six hundred and forty-four rows and a mean rent that moved from 211.05 to 223.59 shekels without a single cell changing. The defences are the same three every time: validate equals m colon 1, indicator equals True, and an assertion on the row count after the merge.</title><g><marker id="d99829-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M371.8,90.2L371.8,94.8C371.8,99.3,371.8,108.4,377.1,121.9C382.3,135.3,392.8,153.1,398,162L403.2,170.9" class="edge-thickness-normal edg  واحدة. والدفاعات هي الثلاثة نفسها في كل مرة: validate يساوي m:1، وindicator يساوي True، وتأكيد على عدد الصفوف بعد الدمج."><title>مخطط انسيابي لأنواع الدمج الأربعة وما يفعله كلٌّ منها بعدد الصفوف، مقيسًا على الملفات الحقيقية. تلتقي 503 إعلانات بمرجع مدن من ستة صفوف. والسؤال الأول والوحيد المهم هو على أي مفتاح تدمج. فالدمج على عمود المدينة الخام يطابق 316 صفًّا لأن ستًّا وعشرين صورة إملائية تمثّل خمس مدن؛ والدمج على الاسم المنظَّف يطابق الصفوف الـ503 كلها. ثم تتصرّف الأنواع الأربعة تحت كل مفتاح تصرّفًا مختلفًا. فالدمج الداخلي يبقي الصفوف المطابقة وحدها: 316 على المفتاح الخام، وهذا يحذف 187 إعلانًا بصمت، أو 503 على المفتاح المنظَّف، وهذا لا يحذف شيئًا. والدمج الأيسر يبقي كل إعلان ويعبّئ أعمدة المرجع بفراغات حيث لا مطابقة: 503 صفوف في الحالتين، مع 187 صفًّا من الفراغات على المفتاح الخام. والدمج الأيمن يبقي كل صف من المرجع، فيضيف بيت لاهيا، وهي مدينة لا إعلانات لها، صفًّا واحدًا من الفراغات. والدمج الخارجي يبقي الطرفين فيعطي 504 صفوف. وبجانب الأربعة يقف الفخّ الذي ليس نوعًا من الدمج أصلًا: إذا لم يكن المفتاح فريدًا في الطرف الأيمن نُسخ كل صف أيسر مطابق مرةً لكل مطابقة، فتصير 480 شقة مقابل مرجع يظهر فيه صف غزة مرتين 644 صفًّا ومتوسط إيجار انزاح أربعين شيكلًا دون أن تتغيّر خليةٌ واحدة. والدفاعات هي الثلاثة نفسها في كل مرة: validate يساوي m:1، وindicator يساوي True، وتأكيد على عدد الصفوف بعد الدمج.</title><g><marker id="d24f83-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M334.4,91.8L334.4,96.1C334.4,100.4,334.4,109,339.9,122.4C345.5,135.9,356.6,154.2,362.2,163.4L367.7,172.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d24f83-0)"></path><path d="M474.1,93.6L474.1,97.6C474.1,101.6,474.1,109.6,468.5,122.7C463,135.9,451.9,154.2,446.3,163.4L440.7,172.6" class="edge-
