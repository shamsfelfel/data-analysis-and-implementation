ar"><svg id="dg-t2-l4-fences-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1345.1875 335.1000061035156" style="width:100%;height:auto;max-width:1346px;--dg-w:1346px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="مخطط انسيابي من اليسار إلى اليمين يبني سياج المدى الربيعي على عمود الإيجار في ملف هذا الفصل، خطوةً خطوة، حتى يكون كل رقم في الصورة قابلًا للتتبّع. تبدأ السلسلة من الإيجارات الأربعمئة وأربعة والثمانين التي تحمل قيمة فعلًا. وترتيبها يعطي الربيعات الثلاثة المهمة: الربيع الأول Q1 يساوي مئة وثلاثة وخمسين وخمسة وسبعين من مئة، وهو الإيجار الذي يقع عند رُبع العمود المرتَّب، والوسيط مئتان، والربيع الثالث Q3 مئتان وخمسة وخمسون. ومن Q1 وQ3 يُحسب المدى الربيعي بأنه Q3 ناقص Q1، أي مئة وواحد وربع شيكل، وهذا العرض هو المسطرة كلها: فهو يصف النصف الأوسط من السوق ويُحسب من الرُّتب، فلا تستطيع خلية واحدة أن تمدّه. ثم تضرب العُرف المدى الربيعي في واحد ونصف وتخطو ذلك البعد خارج كل ربيع. فالسياج الأدنى هو Q1 ناقص مدًى ربيعي ونصف، ويبلغ شيكلًا وثُمنًا تقريبًا، والسياج الأعلى هو Q3 زائد مدًى ربيعي ونصف، ويبلغ أربعمئة وستة وسبعة أثمان من الشيكل. وتطبيق السياجين على العمود يعلّم اثنتي عشرة قيمة، كلها فوق السياج الأعلى ولا واحدة تحت الأدنى. وتنقسم هذه الاثنتا عشرة إلى قيمة مستحيلة واحدة، وهي الإيجار تسعة وتسعون ألفًا وتسعمئة وتسعة وتسعون في الإعلان 5062، وإحدى عشرة شقة غالية حقًّا من أربعمئة وخمسة عشر إلى خمسمئة وثمانين شيكلًا. وتتعلّق بالصورة ملاحظتان جانبيتان. فالسياج الأدنى، شيكل وثُمن، تحت كل إيجار ممكن، فلا يستطيع السياج أن يعلّم قيمةً من أسفل هذا العمود قط، ولهذا تعبر أجرةُ اليوم البالغة خمسة وعشرين شيكلًا في الإعلان 5208 دون أن يراها أحد. والمضاعِف واحد ونصف عُرفٌ لا مبرهنة: ففي عمود جَرَسي تمام الاعتدال كان سيعلّم نحو سبع قيم في الألف، وفي عمود مالي ملتوٍ إلى اليمين مثل هذا يعلّم الذيل الأعلى كله."><title>مخطط انسيابي من اليسار إلى اليمين يبني سياج المدى الربيعي على عمود الإيجار في ملف هذا الفصل، خطوةً خطوة، حتى يكون كل رقم في الصورة قابلًا للتتبّع. تبدأ السلسلة من الإيجارات الأربعمئة وأربعة والثمانين التي تحمل
