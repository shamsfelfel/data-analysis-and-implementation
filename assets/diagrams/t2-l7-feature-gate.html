<div class="dg" data-diagram="t2-l7-feature-gate"><div class="en"><svg id="dg-t2-l7-feature-gate-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 911.4425659179688 1682.85302734375" style="width:100%;height:auto;max-width:912px;--dg-w:912px;direction:ltr" data-wide="1" role="img" aria-label="Decision tree a candidate feature must pass before it is allowed into the matrix. A proposed new column enters at the top and meets four gates in order. Gate one asks whether the value would be known at the moment the prediction is needed; a column that would not be available then is dropped, because knowing it is the definition of leakage. Gate two asks whether the column needs a parameter, such as band edges, a category list, a mean or an as-of date; if it does, that parameter is fitted on the training rows and stored, and if it is instead computed over the whole frame the feature is rejected and sent back. Gate three asks whether the feature improves the validation score, not the training score; the two worked examples divide here. Month, weekday and is_weekend improve training from 57.09 to about 55.9 and make validation worse, moving 77.64 to 77.87 for month and 79.78 for weekday, so they are rejected as overfitting dressed as feature engineering. The area band improves validation from 77.64 to 63.26, so it passes, and crossing it with the governorate reaches 54.58 on validation and 46.94 on test. Gate four asks whether the gain survives the fold spread measured by cross-validation, which is about seven shekels on this data; a gain smaller than that is not evidence. A feature that passes all four is written into the fitted dictionary with its parameter, and a closing note records the price of binning: areas of 62 and 72 square metres share one band, collapse to the same midpoint of 67.388 and therefore receive one prediction."><title>Decision tree a candidate feature must pass before it is allowed into the matrix. A proposed new column enters at the top and meets four gates in order. Gate one asks whether the value would be known at the moment the prediction is needed; a column that would not be available then is dropped, because knowing it is the definition of leakage. Gate two asks whether the column needs a parameter, such as band edges, a category list, a mean or an as-of date; if it does, that parameter is fitted on the training rows and stored, and if it is instead computed over the whole frame the feature is rejected and sent back. Gate three asks whether the feature improves the validation score, not the training score; the two worked examples divide here. Month, weekday and is_weekend improve training from 57.09 to about 55.9 and make validation worse, moving 77.64 to 77.87 for month and 79.78 for weekday, so they are rejected as overfitting dressed as feature engineering. The area band improves validation from 77.64 to 63.26, so it passes, and crossing it with the governorate reaches 54.58 on validation and 46.94 on test. Gate four asks whether the gain survives the fold spread measured by cross-validation, which is about seven shekels on this data; a gain smaller than that is not evidence. A feature that passes all four is written into the fitted dictionary with its parameter, and a closing note records the price of binning: areas of 62 and 72 square metres share one band, collapse to the same midpoint of 67.388 and therefore receive one prediction.</title><g><marker id="d6b4da-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M405.2,41.5L405.1,45.4C405,49.3,404.9,57.2,404.8,64.4C404.7,71.7,404.7,78.3,404.7,81.7L404.7,85" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d6b4da-0) e default dg-bad" transform="translate(752.5,872.8)"><rect class="basic label-container" x="-84.3" y="-31.3" width="168.7" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">reject:</tspan><tspan x="0" y="2.1em">leak 2 in disguise</tspan></text></g></g><g class="node default" transform="translate(448.6,1110.1)"><rect class="basic label-container" x="-126.2" y="-40.1" width="252.3" height="80.2"></rect><g class="label" transform="translate(0,-28.1)"><text><tspan x="0" y="1em">month, weekday, is_weekend</tspan><tspan x="0" y="2.1em">train 57.09 to 55.9</tspan><tspan x="0" y="3.2em">validation 77.64 to 79.78</tspan></text></g></g><g class="node default" transform="translate(171.3,1110.1)"><rect class="basic label-container" x="-111.1" y="-31.3" width="222.1" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">area band</tspan><tspan x="0" y="2.1em">validation 77.64 to 63.26</tspan></text></g></g><g class="node default" transform="translate(171.3,1304.6)"><polygon points="106.4,0 212.8,-106.4 106.4,-212.8 0,-106.4" class="label-container" transform="translate(-105.9,106.4)"></polygon><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">is the gain bigger</tspan><tspan x="0" y="2.1em">than the fold spread?</tspan></text></g></g><g class="node default dg-bad" transform="translate(448.6,1304.6)"><rect class="basic label-container" x="-105.4" y="-31.3" width="210.8" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">rejected: overfitting</tspan><tspan x="0" y="2.1em">dressed as engineering</tspan></text></g></g><g class="node default" transform="translate(116.4,1524.2)"><rect class="basic label-container" x="-108.4" y="-40.1" width="216.9" height="80.2"></rect><g class="label" transform="translate(0,-28.1)"><text><tspan x="0" y="1em">not evidence -</tspan><tspan x="0" y="2.1em">say so, keep the simpler</tspan><tspan x="0 وإن حُسب على الإطار كله رُفضت السمة وأُعيدت. وتسأل البوابة الثالثة هل تحسّن السمةُ نتيجةَ التحقّق لا نتيجة التدريب؛ وهنا يفترق المثالان المحسوبان. فالشهر واليوم ونهاية الأسبوع تحسّن التدريب من 57.09 إلى نحو 55.9 وتُسيء إلى التحقّق، فتنقله من 77.64 إلى 77.87 للشهر و79.78 لليوم، فتُرفَض بوصفها إفراطَ ملاءمة متلبّسًا بهندسة السمات. أما نطاق المساحة فيحسّن التحقّق من 77.64 إلى 63.26 فيمرّ، وتقاطعه مع المحافظة يبلغ 54.58 على التحقّق و46.94 على الاختبار. وتسأل البوابة الرابعة هل يصمد المكسب أمام تشتّت الطيّات الذي قاسه التحقّق المتقاطع، وهو نحو سبعة شواكل في هذه البيانات؛ والمكسب الأصغر من ذلك ليس دليلًا. والسمة التي تمرّ بالبوابات الأربع تُكتب في قاموس الوسائط المضبوطة مع وسيطها، وتسجّل ملاحظة ختامية ثمن التنطيق: مساحتا 62 و72 مترًا مربعًا تتشاركان نطاقًا واحدًا وتنطويان على نقطة المنتصف نفسها 67.388 فتتلقّيان تنبؤًا واحدًا."><title>شجرة قرار يجب أن تمرّ بها سمةٌ مرشَّحة قبل أن يُسمح لها بالدخول إلى المصفوفة. يدخل العمود الجديد المقترَح من الأعلى ويلقى أربع بوابات بالترتيب. تسأل البوابة الأولى هل ستكون القيمة معلومة في اللحظة التي يُحتاج فيها التنبؤ؛ والعمود الذي لن يكون متاحًا حينئذ يُسقَط، فمعرفته هي تعريف التسريب نفسه. وتسأل البوابة الثانية هل يحتاج العمود وسيطًا، كحدود النطاقات أو قائمة فئات أو متوسط أو تاريخ أساس؛ فإن احتاج ضُبط ذلك الوسيط على صفوف التدريب وحُفظ، وإن حُسب على الإطار كله رُفضت السمة وأُعيدت. وتسأل البوابة الثالثة هل تحسّن السمةُ نتيجةَ التحقّق لا نتيجة التدريب؛ وهنا يفترق المثالان المحسوبان. فالشهر واليوم ونهاية الأسبوع تحسّن التدريب من 57.09 إلى نحو 55.9 وتُسيء إلى التحقّق، فتنقله من 77.64 إلى 77.87 للشهر و79.78 لليوم، فتُرفَض بوصفها إفراطَ ملاءمة متلبّسًا بهندسة السمات. أما نطاق المساحة فيحسّن التحقّق من 77.64 إلى 63.26 فيمرّ، وتقاطعه مع المحافظة يبلغ 54.58 على التحقّق و46.94 على الاختبار. وتسأل البوابة الرابعة هل يصمد المكسب أمام تشتّت الطيّات الذي قاسه التحقّق المتقاطع، وهو نحو سبعة شواكل في هذه البيانات؛ والمكسب الأصغر من ذلك ليس دليلًا. والسمة التي تمرّ بالبوابات الأربع تُكتب في قاموس الوسائط المضبوطة مع وسيطها، وتسجّل ملاحظة ختامية ثمن التنطيق
