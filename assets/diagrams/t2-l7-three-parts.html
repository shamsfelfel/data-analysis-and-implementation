<div class="dg" data-diagram="t2-l7-three-parts"><div class="en"><svg id="dg-t2-l7-three-parts-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.000003814697265625 683.384765625 1167.717529296875" style="width:100%;height:auto;max-width:684px;--dg-w:684px;direction:ltr" data-wide="1" role="img" aria-label="Flowchart of the three-way split and what each part is allowed to do. The 480 deduplicated flats enter at the top and are shuffled once with a recorded seed, then cut into three parts: 288 training rows, 96 validation rows and 96 test rows. Three arrows leave the training rows: every parameter is fitted there, which includes the median, the fence, the category lists and the band edges, and the arrow is labelled &quot;fit here, many times&quot;. The validation rows receive those fitted parameters and are used to compare candidate recipes and choose one, labelled &quot;read often, never fit on&quot;; a loop returns from the validation rows to the training rows, because every comparison sends you back to change the recipe. The test rows sit apart behind a gate marked &quot;read once, at the end&quot;, and the only thing allowed through the gate is the single recipe that validation already chose. A warning node states the rule the chapter broke: a number you optimised against is a training number wearing a disguise, so the held-out score of Lessons 1 to 6 was never a final score. A second note records what must be written down beside the three frames: the seed, the proportions and the as-of date, because a split nobody recorded cannot be repeated."><title>Flowchart of the three-way split and what each part is allowed to do. The 480 deduplicated flats enter at the top and are shuffled once with a recorded seed, then cut into three parts: 288 training rows, 96 validation rows and 96 test rows. Three arrows leave the training rows: every parameter is fitted there, which includes the median, the fence, the category lists and the band edges, and the arrow is labelled "fit here, many times". The validation rows receive those fitted parameters and are used to compare candidate recipes and choose one, labelled "read often, never fit on"; a loop returns from the validation rows to the training rows, because every comparison sends you back to change the recipe. The test rows sit apart behind a gate marked "read once, at the end", and the only thing allowed through the gate is the single recipe that validation already chose. A warning node states the rule the chapter broke: a number you optimised against is a training number wearing a disguise, so the held-out score of Lessons 1 to 6 was never a final score. A second note records what must be written down beside the three frames: the seed, the proportions and the as-of date, because a split nobody recorded cannot be repeated.</title><g><marker id="dfc313-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M114,100.1L114,104.1C114,108.1,114,116.1,114,123.5C114,130.8,114,137.5,114,140.8L114,144.1" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dfc313-0)"></path><path d="M220,193.4L272.1,200.3C324.2,207.2,428.5,221,480.6,231.2C532.7,241.4,532.7,248.1,532.7,251.4L532.7,254.7" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dfc313-0)"></path><path d="M107.3,210.7L106.4,214.7C105.5,218.7,103.8,226.7,103,240C102.1,253.2,102.1,271.6,102.1,292.1C102.1,312.6,102.1,335.2,102.1,359.3C102.1,383.4,102.1,408.9,102.1,434.4C102.1,460,102.1,485.5,110.3,505.4C118.4,525.3,134.7,539.5,142.8,546.6L151,553.7" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dfc313-0)"></path><path d="M64.4,210.7L58,214.7 حدة التي اختارها التحقّق سلفًا. وتنصّ عقدة تحذير على القاعدة التي خرقها الفصل: الرقم الذي حسّنته مقابله رقمُ تدريب متنكّر، فنتيجة الصفوف المحجوزة في الدروس 1 إلى 6 لم تكن قط نتيجة نهائية. وتسجّل ملاحظة ثانية ما يجب كتابته بجانب الأطر الثلاثة: البذرة والنسب وتاريخ الأساس، فالتقسيم الذي لم يسجّله أحد لا يمكن إعادته."><title>مخطط انسيابي للتقسيم الثلاثي وما يُسمح لكل قسم بفعله. تدخل الشقق الـ480 بعد إزالة التكرار من الأعلى وتُخلط مرة واحدة ببذرة مسجَّلة، ثم تُقطع إلى ثلاثة أقسام: 288 صف تدريب و96 صف تحقّق و96 صف اختبار. وتخرج من صفوف التدريب ثلاثة أسهم: كل وسيط يُضبَط هناك، ويشمل ذلك الوسيط والسياج وقوائم الفئات وحدود النطاقات، والسهم موسوم بـ«اضبط هنا، مرات كثيرة». وتستقبل صفوف التحقّق تلك الوسائط المضبوطة وتُستعمل لمقارنة الوصفات المرشَّحة واختيار واحدة، وهي موسومة بـ«اقرأ كثيرًا، ولا تضبط عليها قط»؛ وتعود حلقة من صفوف التحقّق إلى صفوف التدريب، لأن كل مقارنة تردّك لتغيير الوصفة. وتقف صفوف الاختبار منفصلةً خلف بوابة موسومة بـ«اقرأ مرة واحدة، في النهاية»، والشيء الوحيد المسموح بمروره هو الوصفة الواحدة التي اختارها التحقّق سلفًا. وتنصّ عقدة تحذير على القاعدة التي خرقها الفصل: الرقم الذي حسّنته مقابله رقمُ تدريب متنكّر، فنتيجة الصفوف المحجوزة في الدروس 1 إلى 6 لم تكن قط نتيجة نهائية. وتسجّل ملاحظة ثانية ما يجب كتابته بجانب الأطر الثلاثة: البذرة والنسب وتاريخ الأساس، فالتقسيم الذي لم يسجّله أحد لا يمكن إعادته.</title><g><marker id="d6de35-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M105,100.1L105,104.1C105,108.1,105,116.1,105,123.4C105,130.8,105,137.4,105,140.8L105,144.1" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d6de35-0)"></path><path d="M202,194.6L244.4,201.3C286.9,208,371.9,221.3,414.4,231.3C456.9,241.4,456.9,248,456.9,251.4L456.9,254.7" class="edge-thi
