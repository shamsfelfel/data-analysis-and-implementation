<div class="dg" data-diagram="t2-l7-leak-types"><div class="en"><svg id="dg-t2-l7-leak-types-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1449.6461181640625 1129.80615234375" style="width:100%;height:auto;max-width:1450px;--dg-w:1450px;direction:ltr" data-wide="1" role="img" aria-label="Decision tree for diagnosing a result that looks too good, organised as the three ways a score leaks. The tree starts from a suspiciously good score and asks three questions in turn. First: does the same fact appear in both halves? On this file six of the hundred and two test rows carry a listing_id that also sits in training, and the error on those six rows is 21.67 shekels against 62.20 on the other ninety-six, so the cure is to de-duplicate on the business key before splitting, never after. Second: was any parameter fitted before the split? Target-encoding the agency with a median taken over every row reports 59.49 where the honest number fitted on training alone is 61.02, and the cure is that every fit, including imputation, scaling, encoding, band edges and feature selection, happens inside the training rows only. Third: can a feature see the future? A random split over four months of adverts mixes May into the training of June, and a recency feature built from the newest date in the whole file reads a parameter out of rows you are not allowed to touch; the cure is to split by time when time matters and to declare the as-of date as a parameter. A closing node names the honest result on this dataset: the chronological split scored 55.45 against the random split's 60.91, better rather than worse, because the market barely moved over the window, so this particular check cost nothing here and still had to be run, because nobody can know that in advance."><title>Decision tree for diagnosing a result that looks too good, organised as the three ways a score leaks. The tree starts from a suspiciously good score and asks three questions in turn. First: does the same fact appear in both halves? On this file six of the hundred and two test rows carry a listing_id that also sits in training, and the error on those six rows is 21.67 shekels against 62.20 on the other ninety-six, so the cure is to de-duplicate on the business key before splitting, never after. Second: was any parameter fitted before the split? Target-encoding the agency with a median taken over every row reports 59.49 where the honest number fitted on training alone is 61.02, and the cure is that every fit, including imputation, scaling, encoding, band edges and feature selection, happens inside the training rows only. Third: can a feature see the future? A random split over four months of adverts mixes May into the training of June, and a recency feature built from the newest date in the whole file reads a parameter out of rows you are not allowed to touch; the cure is to split by time when time matters and to declare the as-of date as a parameter. A closing node names the honest result on this dataset: the chronological split scored 55.45 against the random split's 60.91, better rather than worse, because the market barely moved over the window, so this particular check cost nothing here and still had to be run, because nobody can know that in advance.</title><g><marker id="d7a2f5-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M553.3,59.1L553.2,63C553.1,66.9,553,74.8,552.9,82C552.8,89.3,552.8,95.9,552.8,99.3L552.8,102.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d7a2f5-0)"></path><path d="M472.3,242.8L415.9,262.3C359.5,281.8,246.7,320.8,190.3,355.5C134,390.2,134,420.7,134,436L134,451.2" class="edge-thickness-normal edge-patter file: the time</tspan><tspan x="0" y="2.1em">split</tspan><tspan x="0" y="3.2em">scored 55.45 against 60.91 -</tspan><tspan x="0" y="4.3em">better, because the market</tspan><tspan x="0" y="5.4em">held still</tspan></text></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l7-leak-types-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1428.175048828125 1079.921875" style="width:100%;height:auto;max-width:1429px;--dg-w:1429px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="شجرة قرار لتشخيص نتيجة تبدو أحسن من اللازم، مرتَّبة على الطرق الثلاث التي تتسرّب بها النتيجة. تبدأ الشجرة من نتيجة مريبة في حسنها وتسأل ثلاثة أسئلة بالتتابع. الأول: هل تظهر الحقيقة نفسها في النصفين؟ في هذا الملف يحمل ستة من صفوف الاختبار المئة واثنين رقم إعلان موجودًا أيضًا في التدريب، والخطأ على تلك الصفوف الستة 21.67 شيكلًا مقابل 62.20 على الستة والتسعين الأخرى، فالعلاج إزالة التكرار على المفتاح العملي قبل التقسيم لا بعده. والثاني: هل ضُبط أي وسيط قبل التقسيم؟ ترميز الوكالة بالهدف بوسيط مأخوذ على كل الصفوف يُبلّغ 59.49 حيث الرقم الأمين المضبوط على التدريب وحده 61.02، والعلاج أن كل ضبط، ويشمل التعويض وتوحيد المقياس والترميز وحدود النطاقات واختيار السمات، يحدث داخل صفوف التدريب وحدها. والثالث: هل تستطيع سمةٌ أن ترى المستقبل؟ التقسيم العشوائي على أربعة أشهر من الإعلانات يخلط أيار في تدريب حزيران، وسمةُ حداثة مبنيّة على أحدث تاريخ في الملف كله تقرأ وسيطًا من صفوف لا يُسمح لك بلمسها؛ والعلاج أن تقسّم بالزمن حين يهمّ الزمن وأن تعلن تاريخ الأساس وسيطًا. وتسمّي عقدة ختامية النتيجة الأمينة على هذه البيانات: سجّل التقسيم الزمني 55.45 مقابل 60.91 للتقسيم العشوائي، أحسنَ لا أسوأ، لأن السوق لم يتحرّك إلا قليلًا خلال النافذة، فلم يكلّف هذا الفحص بعينه شيئًا هنا وكان لا بدّ من إجرائه، إذ لا يستطيع أحد أن يعرف ذلك سلفًا."><title>شجرة قرار لتشخيص نتيجة تبدو أحسن من اللازم، مرتَّبة على الطرق الثلاث التي تتسرّب بها النتيجة. تبدأ الشجرة من نتيجة مريبة في حسنها وتسأل ثلاثة أسئلة بالتتابع. الأول: هل تظهر الحقيقة نفسها في النصفين؟ في هذا الملف يح
