</text></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l2-decision-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056.671875 971.90625" style="width:100%;height:auto;max-width:1057px;--dg-w:1057px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="شجرة قرار لعمود واحد فيه فراغات. السؤال الأول: هل هذا العمود هو الهدف الذي تتنبأ به؟ فإن كان، فاحذف تلك الصفوف ولا تعوّضها قط. وإن لم يكن، فالسؤال الثاني: كم نسبة الفراغ في العمود؟ فإن كان كله تقريبًا فاحذف العمود نفسه. وإلا فالسؤال الثالث: أي آلية؟ فإن كانت فقدًا غير عشوائي (MNAR) فاحذف الصفوف أو نمذج الفقد، وقل ذلك في السجل. وإن كانت فقدًا عشوائيًّا مشروطًا (MAR) فاضبط قاعدة لكل مجموعة مع بديل للمجموعة الخالية. وإن كانت فقدًا عشوائيًّا تامًّا (MCAR) فاضبط وسيط مجموعة، أو وسيطًا عامًّا إذا كانت الفراغات قليلة. ثم تضيف فروع التعويض الثلاثة عَلَم فقد وتكتب سطرًا واحدًا في سجل القرارات فيه العمود والعدد والآلية والسبب."><title>شجرة قرار لعمود واحد فيه فراغات. السؤال الأول: هل هذا العمود هو الهدف الذي تتنبأ به؟ فإن كان، فاحذف تلك الصفوف ولا تعوّضها قط. وإن لم يكن، فالسؤال الثاني: كم نسبة الفراغ في العمود؟ فإن كان كله تقريبًا فاحذف العمود نفسه. وإلا فالسؤال الثالث: أي آلية؟ فإن كانت فقدًا غير عشوائي (MNAR) فاحذف الصفوف أو نمذج الفقد، وقل ذلك في السجل. وإن كانت فقدًا عشوائيًّا مشروطًا (MAR) فاضبط قاعدة لكل مجموعة مع بديل للمجموعة الخالية. وإن كانت فقدًا عشوائيًّا تامًّا (MCAR) فاضبط وسيط مجموعة، أو وسيطًا عامًّا إذا كانت الفراغات قليلة. ثم تضيف فروع التعويض الثلاثة عَلَم فقد وتكتب سطرًا واحدًا في سجل القرارات فيه العمود والعدد والآلية والسبب.</title><g><marker id="db4e49-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M388.1,41.5L388,45.4C387.9,49.3,387.7,57.2,387.6,64.4C387.6,7
