<div class="dg" data-diagram="t2-l3-type-repair"><div class="en"><svg id="dg-t2-l3-type-repair-en" data-t="sequence" xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 925 799" style="width:100%;height:auto;max-width:925px;--dg-w:925px;direction:ltr" data-wide="1" role="img" aria-label="Sequence diagram of a type repair, showing the four participants that have to agree: the analyst, the raw text column, pandas, and the decision log. The analyst first asks the column what it holds and is told that it is an object column with nine distinct values, of which seven are digits, nineteen cells say G and nine cells are blank. The analyst asks pandas to convert it with to_numeric and no arguments, and pandas refuses with a ValueError naming the string G at position thirty-six. The analyst then asks for errors equals coerce, and pandas returns a float column with twenty-eight missing values, nine of which were blank and nineteen of which were ground floors: the conversion succeeded and the information that a ground floor is a floor was destroyed without a word. The analyst stops, makes a domain decision that ground means zero, and writes that decision in the log with its reason. Only then does the analyst ask pandas to replace G with zero and convert, requesting the nullable Int64 type so that nine genuinely unknown floors stay missing instead of turning the whole column into floats. Pandas returns four hundred and ninety-four typed values and nine missing ones. Finally the analyst asks the log to confirm what happened, and the log replies that nineteen cells changed under a named rule and nine cells remain unknown, so the next reader can see the decision rather than guess it."><title>Sequence diagram of a type repair, showing the four participants that have to agree: the analyst, the raw text column, pandas, and the decision log. The analyst first asks the column what it holds and is told that it is an object column with nine distinct values, of which seven are digits, nineteen cells say G and nine cells are blank. The analyst asks pandas to convert it with to_numeric and no arguments, and pandas refuses with a ValueError naming the string G at position thirty-six. The analyst then asks for errors equals coerce, and pandas returns a float column with twenty-eight missing values, nine of which were blank and nineteen of which were ground floors: the conversion succeeded and the information that a ground floor is a floor was destroyed without a word. The analyst stops, makes a domain decision that ground means zero, and writes that decision in the log with its reason. Only then does the analyst ask pandas to replace G with zero and convert, requesting the nullable Int64 type so that nine genuinely unknown floors stay missing instead of turning the whole column into floats. Pandas returns four hundred and ninety-four typed values and nine missing ones. Finally the analyst asks the log to confirm what happened, and the log replies that nineteen cells changed under a named rule and nine cells remain unknown, so the next reader can see the decision rather than guess it.</title><rect x="675" y="713" width="150" height="44" name="L" rx="3" ry="3" class="actor actor-bottom"></rect><text x="750" y="735" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="750" dy="0">Decision log</tspan></text><rect x="485" y="713" width="150" height="44" name="P" rx="3" ry="3" class="actor actor-bottom"></rect><text x="560" y="735" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="560" dy="0">pandas</tspan></text><rect x="295" y="713" width="150" height="44" name="C" rx="3" ry="3" class="actor actor-bottom"></rect><text x="370" y="735" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="370" dy="0">floor column</tspan></text><line x1="750" y1="44" x2="750" y2
