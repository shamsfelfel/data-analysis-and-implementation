 إيجار نصي إلى أرقام. مع astype(float) تحوّل pandas كل قيمة، فإن نجحت كلها حصلت على سلسلة float64، لكن قيمة واحدة سيئة مثل n/a ترفع ValueError ولا يُحتفظ بشيء. ومع to_numeric وerrors coerce تصبح كل قيمة تفشل NaN دون أي خطأ، وعليك أنت أن تعدّ قيم NaN التي لم تتوقعها."><title>مخطط تسلسلي لطريقتين لتحويل عمود إيجار نصي إلى أرقام. مع astype(float) تحوّل pandas كل قيمة، فإن نجحت كلها حصلت على سلسلة float64، لكن قيمة واحدة سيئة مثل n/a ترفع ValueError ولا يُحتفظ بشيء. ومع to_numeric وerrors coerce تصبح كل قيمة تفشل NaN دون أي خطأ، وعليك أنت أن تعدّ قيم NaN التي لم تتوقعها.</title><rect x="508" y="966" width="150" height="44" name="S" rx="3" ry="3" class="actor actor-bottom"></rect><text x="583" y="988" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="583" dy="0">العمود النصي</tspan></text><rect x="318" y="966" width="150" height="44" name="P" rx="3" ry="3" class="actor actor-bottom"></rect><text x="393" y="988" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="393" dy="0">⁦pandas⁩</tspan></text><rect x="0" y="966" width="150" height="44" name="Y" rx="3" ry="3" class="actor actor-bottom"></rect><text x="75" y="988" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="75" dy="0">كودك</tspan></text><line x1="583" y1="44" x2="583" y2="966" class="actor-line 200" stroke-width="0.5px" name="S"></line><rect x="508" y="0" width="150" height="44" name="S" rx="3" ry="3" class="actor actor-top"></rect><text x="583" y="22" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="583" dy="0">العمود النصي</tspan></text><line x1="393" y1="44" x2="393" y2="966" class="actor-line 200" stroke-width="0.5px" name="P"></line><rect x="318" y="0" width="150" height="44" name="P" rx="3" ry="3" class="actor actor-top"></rect><text
