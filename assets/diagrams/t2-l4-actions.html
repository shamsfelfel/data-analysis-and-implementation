<div class="dg" data-diagram="t2-l4-actions"><div class="en"><svg id="dg-t2-l4-actions-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986.671875 712.6000366210938" style="width:100%;height:auto;max-width:987px;--dg-w:987px;direction:ltr" data-wide="1" role="img" aria-label="A flowchart of the four actions you may take on a flagged numeric value, with the price each one charges, measured on the rent column of this chapter's file against the held-out baseline error of Lesson 1. The chart starts from a flagged value and branches four ways. Remove deletes the row: eleven rows go, the median moves from two hundred to one hundred and ninety-five, and the trap is that deleting the flagged rows from the held-out set as well makes the error read fifty-five point four seven instead of the honest sixty, because you deleted the very rows you were about to be judged on. Cap, also called clipping or winsorising, pulls the value to the threshold: every row survives and the median does not move, but the column now contains a number no landlord asked for, so an eleven-row claim that nothing in Gaza City costs more than four hundred and six point eight seven five shekels is written into the data. Transform applies a logarithm, with log1p rather than log so that a zero survives: nothing is deleted and nothing is invented, the skew falls from one point zero one to minus zero point four seven, and the price is interpretability, because a coefficient is now about percentages and the mean cannot be carried back to shekels. Flag and keep adds a boolean column and deletes nothing: it is the only action that is reversible, it is always safe to report, and its price is that it decides nothing by itself and must never be used as a feature when the flag was computed from the target you are predicting. All four branches converge on the same two obligations, which are to record the rule, the threshold and the count in the log, and to measure the result on rows the rule has never seen. The chart ends with the rule that decides between them: a wrong value may be repaired anywhere in the file, including the rows you are judged on, because repairing it learns nothing from the data, while removing a rare but real row is a modelling choice that may touch the training rows only."><title>A flowchart of the four actions you may take on a flagged numeric value, with the price each one charges, measured on the rent column of this chapter's file against the held-out baseline error of Lesson 1. The chart starts from a flagged value and branches four ways. Remove deletes the row: eleven rows go, the median moves from two hundred to one hundred and ninety-five, and the trap is that deleting the flagged rows from the held-out set as well makes the error read fifty-five point four seven instead of the honest sixty, because you deleted the very rows you were about to be judged on. Cap, also called clipping or winsorising, pulls the value to the threshold: every row survives and the median does not move, but the column now contains a number no landlord asked for, so an eleven-row claim that nothing in Gaza City costs more than four hundred and six point eight seven five shekels is written into the data. Transform applies a logarithm, with log1p rather than log so that a zero survives: nothing is deleted and nothing is invented, the skew falls from one point zero one to minus zero point four seven, and the price is interpretability, because a coefficient is now about percentages and the mean cannot be carried back to shekels. Flag and keep adds a boolean column and deletes nothing: it is the only action that is reversible, it is always safe to report, and its price is that it decides nothing by itself and must never be used as a feature when the flag was computed from the target you are predicting. All four branches converge on the same two obligations, which are to record the rule, the threshold and the count in the log, and to measure the result on rows the rule has never seen. The chart ends with the rule that decides between them: a wrong value may be repaired anywhere in the file, including the rows you are judged on, because repairing it learns nothing from the data, while removing a rare but real row is a modelling choice that may touch the training rows only.</title><g><marker id="d9e5ce-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M406.9,40.8L361.5,46.9C316.1,52.9,225.3,64.9,180,74.3C134.6,83.7,134.6,90.3,134.6,93.7L134.6,97" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M432.3,53L423,57C413.7,61,395.1,69,385.8,76.3C376.4,83.7,376.4,90.3,376.4,93.7L376.4,97" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M537.1,53L546.4,57C555.7,61,574.3,69,583.6,76.3C593,83.7,593,90.3,593,93.7L593,97" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M562.5,40.3L611.3,46.4C660.1,52.5,757.6,64.8,806.3,74.2C855.1,83.7,855.1,90.3,855.1,93.7L855.1,97" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M134.6,163.6L134.6,167.6C134.6,171.6,134.6,179.6,134.6,186.9C134.6,194.3,134.6,200.9,134.6,204.3L134.6,207.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M134.6,274.2L134.6,278.2C134.6,282.2,134.6,290.2,134.6,297.5C134.6,304.9,134.6,311.5,134.6,314.9L134.6,318.2" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d9e5ce-0)"></path><path d="M376.4,163.6L376.4,167.6C376.4,171.6,376.4,179.6,376.4,186.9C376.4, m="translate(484.7,664.5)"><rect class="basic label-container" x="-132.3" y="-40.1" width="264.5" height="80.2"></rect><g class="label" transform="translate(0,-28.1)"><text><tspan x="0" y="1em">repair a wrong value anywhere</tspan><tspan x="0" y="2.1em">remove a rare one in training</tspan><tspan x="0" y="3.2em">only</tspan></text></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l4-actions-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872.0859375 695" style="width:100%;height:auto;max-width:873px;--dg-w:873px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="مخطط انسيابي للأعمال الأربعة التي يجوز لك أن تفعلها بقيمة عددية معلَّمة، مع الثمن الذي يتقاضاه كلٌّ منها، مقيسًا على عمود الإيجار في ملف هذا الفصل مقابل خطأ الدرس الأول على الصفوف المحجوزة. يبدأ المخطط من قيمة معلَّمة ويتفرّع أربعة فروع. فالإزالة تحذف الصف: تذهب أحد عشر صفًّا، وينتقل الوسيط من مئتين إلى مئة وخمسة وتسعين، والفخّ أن حذف الصفوف المعلَّمة من المجموعة المحجوزة أيضًا يجعل الخطأ يُقرأ خمسة وخمسين وسبعة وأربعين من مئة بدل ستين الأمينة، لأنك حذفت الصفوف نفسها التي كنت ستُحكَم عليك بها. وتحديد السقف، ويسمّى أيضًا القصّ أو الوِنْزَرة، يجرّ القيمة إلى الحدّ: فينجو كل صف ولا يتحرك الوسيط، لكن العمود يحتوي الآن رقمًا لم يطلبه مالك، فيُكتب في البيانات ادّعاءٌ من أحد عشر صفًّا بأن لا شيء في مدينة غزة يكلّف أكثر من أربعمئة وستة وسبعة أثمان من الشيكل. والتحويل يطبّق لوغاريتمًا، بـlog1p لا log حتى ينجو الصفر: فلا يُحذف شيء ولا يُختلق شيء، ويهبط الالتواء من واحد وواحد من مئة إلى سالب سبعة وأربعين من مئة، والثمن قابلية التفسير، لأن المعامل صار عن النسب المئوية ولا يمكن إعادة المتوسط إلى الشواكل. والتعليم والإبقاء يضيف عمودًا منطقيًّا ولا يحذف شيئًا: فهو العمل الوحيد القابل للعكس، والإبلاغ به آمن دائمًا، وثمنه أنه لا يقرّر شيئًا بنفسه ولا يجوز استعماله خاصيةً قط إذا كان العلم محسوبًا من الهدف الذي تتنبأ به. وتتلاقى الفروع الأربعة على الواجبين نفسيهما: أن تسجّل القاعدة والحدّ والعدد في السجل، وأن تقيس النتيجة على صفوف لم ترها القاعدة قط. وينتهي المخطط بالقاعدة التي تحسم بينها: القيمة الخاطئة يجوز إصلاحها في أي مكان في الملف ومنه الصفوف التي تُحكَم عليك بها، لأن إصلاحها لا يتعلّم شيئًا من البيانات، أما حذف صفٍّ نادر لكنه حقيقي فخيار نمذجة لا يجوز أن يمسّ إلا صفوف التدريب."><title>مخطط انسيابي للأعمال الأربعة التي يجوز لك أن تفعلها بقيمة عددية معلَّمة، مع الثمن الذي يتقاضاه كلٌّ منها، مقيسًا على عمود الإيجار في ملف هذا الفصل مقابل خطأ الدرس الأول على الصفوف المحجوزة. يبدأ المخطط من قيمة معلَّمة ويتفرّع أربعة فروع. فالإزالة تحذف الصف: تذهب أحد عشر صفًّا، وينتقل الوسيط من مئتين إلى مئة وخمسة وتسعين، والفخّ أن حذف الصفوف المعلَّمة من المجموعة المحجوزة أيضًا يجعل الخطأ يُقرأ خمسة وخمسين وسبعة وأربعين من مئة بدل ستين الأمينة، لأنك حذفت الصفوف نفسها التي كنت ستُحكَم عليك بها. وتحديد السقف، ويسمّى أيضًا القصّ أو الوِنْزَرة، يجرّ القيمة إلى الحدّ: فينجو كل صف ولا يتحرك الوسيط، لكن العمود يحتوي الآن رقمًا لم يطلبه مالك، فيُكتب في البيانات ادّعاءٌ من أحد عشر صفًّا بأن لا شيء في مدينة غزة يكلّف أكثر من أربعمئة وستة وسبعة أثمان من الشيكل. والتحويل يطبّق لوغاريتمًا، بـlog1p لا log حتى ينجو الصفر: فلا يُحذف شيء ولا يُختلق شيء، ويهبط الالتواء من واحد وواحد من مئة إلى سالب سبعة وأربعين من مئة، والثمن قابلية التفسير، لأن المعامل صار عن النسب المئوية ولا يمكن إعادة المتوسط إلى الشواكل. والتعليم والإبقاء يضيف عمودًا منطقيًّا ولا يحذف شيئًا: فهو العمل الوحيد القابل للعكس، والإبلاغ به آمن دائمًا، وثمنه أنه لا يقرّر شيئًا بنفسه ولا يجوز استعماله خاصيةً قط إذا كان العلم محسوبًا من الهدف الذي تتنبأ به. وتتلاقى الفروع الأربعة على الواجبين نفسيهما: أن تسجّل القاعدة والحدّ والعدد في السجل، وأن تقيس النتيجة على صفوف لم ترها القاعدة قط. وينتهي المخطط بالقاعدة التي تحسم بينها: القيمة الخاطئة يجوز إصلاحها في أي مكان في الملف ومنه الصفوف التي تُحكَم عليك بها، لأن إصلاحها لا يتعلّم شيئًا من البيانات، أما حذف صفٍّ نادر لكنه حقيقي فخيار نمذجة لا يجوز أن يمسّ إلا صفوف التدريب.</title><g><marker id="d41ca3-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orien
