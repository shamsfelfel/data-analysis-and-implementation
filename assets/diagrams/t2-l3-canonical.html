<div class="dg" data-diagram="t2-l3-canonical"><div class="en"><svg id="dg-t2-l3-canonical-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417.4375 1276.4842529296875" style="width:100%;height:auto;max-width:418px;--dg-w:418px;direction:ltr" role="img" aria-label="Flowchart of a canonicalisation step. A raw text column holding twenty-six spellings of five cities enters three normalising operations in turn: strip the outer whitespace, lower the case, and collapse every run of spaces into one. Twenty-six spellings become eleven, which is as far as a rule can go, because Khan Yunis and Khan Younis and Jabalya and Jabalia differ by more than whitespace and case. The eleven normalised values are then looked up in an explicit city map with eleven keys. A value found in the map becomes one of the five canonical names and is counted as changed; a value not in the map becomes a missing value with no error and no warning, which is the silent failure of this lesson. The repair is to collect those unmatched normalised values with value_counts and return them beside the column, so the step hands back a frame and a log row carrying the spelling count before, the spelling count after, and the unmatched values by name. The same map is then applied to next month's file without being rebuilt, where Beit Lahia appears in the unmatched report instead of vanishing."><title>Flowchart of a canonicalisation step. A raw text column holding twenty-six spellings of five cities enters three normalising operations in turn: strip the outer whitespace, lower the case, and collapse every run of spaces into one. Twenty-six spellings become eleven, which is as far as a rule can go, because Khan Yunis and Khan Younis and Jabalya and Jabalia differ by more than whitespace and case. The eleven normalised values are then looked up in an explicit city map with eleven keys. A value found in the map becomes one of the five canonical names and is counted as changed; a value not in the map becomes a missing value with no error and no warning, which is the silent failure of this lesson. The repair is to collect those unmatched normalised values with value_counts and return them beside the column, so the step hands back a frame and a log row carrying the spelling count before, the spelling count after, and the unmatched values by name. The same map is then applied to next month's file without being rebuilt, where Beit Lahia appears in the unmatched report instead of vanishing.</title><g><marker id="d48cea-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M197.4,70.6L197.4,74.6C197.4,78.6,197.4,86.6,197.4,93.9C197.4,101.3,197.4,107.9,197.4,111.3L197.4,114.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d48cea-0)"></path><path d="M197.4,181.2L197.4,185.2C197.4,189.2,197.4,197.2,197.4,204.5C197.4,211.9,197.4,218.5,197.4,221.9L197.4,225.2" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d48cea-0)"></path><path d="M197.4,291.8L197.4,295.8C197.4,299.8,197.4,307.8,197.4,315.1C197.4,322.5,197.4,329.1,197.4,332.5L197.4,335.8" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d48cea-0)"></path><path d="M197.4,402.4L197.4,406.4C197.4,410.4,197.4,418.4,197.4,425.7C197.4,433.1,197.4,439.7,197.4,443.1L197.4,446.4" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d48cea-0)"></path><path d="M197.4,513L197.4,517C197.4,521,197.4,529,197.4,536.3C197.4,543.7,197.4,550.3,197.4,553.7L197.4,557" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d48cea-0)"></path><path d="M161.5,666.6L149.1,678.7C136.7,690.7,111.8,714.9,  Khan Yunis وKhan Younis وJabalya وJabalia تختلف بأكثر من المسافات وحالة الأحرف. ثم تُبحث القيم المعيارية الإحدى عشرة في خريطة مدن صريحة بأحد عشر مفتاحًا. فالقيمة الموجودة في الخريطة تصير أحد الأسماء المعيارية الخمسة وتُعَدّ مغيَّرة؛ والقيمة غير الموجودة تصير قيمةً مفقودة بلا خطأ وبلا تحذير، وهذا هو العطل الصامت في هذا الدرس. والإصلاح أن تُجمع تلك القيم المعيارية غير المطابقة بـ value_counts وتُعاد بجانب العمود، فتسلّم الخطوة جدولًا وسطرَ سجل يحمل عدد التهجئات قبل وبعد والقيم غير المطابقة بأسمائها. ثم تُطبَّق الخريطة نفسها على ملف الشهر القادم دون إعادة بناء، فتظهر Beit Lahia في تقرير غير المطابق بدل أن تتلاشى."><title>مخطط انسيابي لخطوة التسوية المعيارية. يدخل عمود نصي خام يحمل ستًّا وعشرين صورة إملائية لخمس مدن ثلاث عمليات تطبيع متتابعة: تشذيب المسافات الخارجية، وتصغير حالة الأحرف، وضغط كل سلسلة مسافات في مسافة واحدة. فتصير التهجئات الستّ والعشرون إحدى عشرة، وهذا أقصى ما تبلغه قاعدة، لأن Khan Yunis وKhan Younis وJabalya وJabalia تختلف بأكثر من المسافات وحالة الأحرف. ثم تُبحث القيم المعيارية الإحدى عشرة في خريطة مدن صريحة بأحد عشر مفتاحًا. فالقيمة الموجودة في الخريطة تصير أحد الأسماء المعيارية الخمسة وتُعَدّ مغيَّرة؛ والقيمة غير الموجودة تصير قيمةً مفقودة بلا خطأ وبلا تحذير، وهذا هو العطل الصامت في هذا الدرس. والإصلاح أن تُجمع تلك القيم المعيارية غير المطابقة بـ value_counts وتُعاد بجانب العمود، فتسلّم الخطوة جدولًا وسطرَ سجل يحمل عدد التهجئات قبل وبعد والقيم غير المطابقة بأسمائها. ثم تُطبَّق الخريطة نفسها على ملف الشهر القادم دون إعادة بناء، فتظهر Beit Lahia في تقرير غير المطابق بدل أن تتلاشى.</title><g><marker id="d73f52-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M184.5,70.6L184.5,74.6C184.5,78.6,184.5,86.6,184.5,93.9C184.5,101.3,184.5,107.9,184.5,111.3L184.5,114.6" class="edge-thickne
