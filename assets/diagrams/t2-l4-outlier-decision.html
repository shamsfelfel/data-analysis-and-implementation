<div class="dg" data-diagram="t2-l4-outlier-decision"><div class="en"><svg id="dg-t2-l4-outlier-decision-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 877.671875 888.4749755859375" style="width:100%;height:auto;max-width:878px;--dg-w:878px;direction:ltr" data-wide="1" role="img" aria-label="Decision tree for a numeric value that a rule has flagged as extreme. Start with the flagged value and ask the only question that matters first: is this value possible at all for this column? If it is impossible, ask next whether the digits themselves are wrong or whether only the unit is wrong. Wrong digits make it a value error, like the rent of 99999 on listing 5062, which is a phone number typed into the rent box, and the action is to void the cell to missing and let Lesson 2's rules handle the hole, applied to every row of the file including the held-out rows, because voiding an impossible value learns nothing from the data. A wrong unit is a different repair with a different action: the five areas recorded in dunum on listings 5015, 5099, 5167, 5290 and 5403 read 0.0379 to 0.0878 instead of 37.9 to 87.8 square metres, and the action is to multiply by a thousand behind a provenance flag, which recovers five real rows instead of deleting them. If the value is possible, ask whether anything outside the column confirms it. If the source or the domain confirms it, the value is rare but real, like the 580 shekel flat in Gaza City, and the actions are to keep it, or to flag it, or to drop it from the training rows only, never from the rows you are judged on. If nothing confirms it, you do not know which kind it is, and the honest action is to flag it, report it, and ask the source, because a rule cannot tell a rare value from a wrong one. Every branch ends in the same obligation: write the decision and its count in the log."><title>Decision tree for a numeric value that a rule has flagged as extreme. Start with the flagged value and ask the only question that matters first: is this value possible at all for this column? If it is impossible, ask next whether the digits themselves are wrong or whether only the unit is wrong. Wrong digits make it a value error, like the rent of 99999 on listing 5062, which is a phone number typed into the rent box, and the action is to void the cell to missing and let Lesson 2's rules handle the hole, applied to every row of the file including the held-out rows, because voiding an impossible value learns nothing from the data. A wrong unit is a different repair with a different action: the five areas recorded in dunum on listings 5015, 5099, 5167, 5290 and 5403 read 0.0379 to 0.0878 instead of 37.9 to 87.8 square metres, and the action is to multiply by a thousand behind a provenance flag, which recovers five real rows instead of deleting them. If the value is possible, ask whether anything outside the column confirms it. If the source or the domain confirms it, the value is rare but real, like the 580 shekel flat in Gaza City, and the actions are to keep it, or to flag it, or to drop it from the training rows only, never from the rows you are judged on. If nothing confirms it, you do not know which kind it is, and the honest action is to flag it, report it, and ask the source, because a rule cannot tell a rare value from a wrong one. Every branch ends in the same obligation: write the decision and its count in the log.</title><g><marker id="dbdfd0-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M451.9,70.6L451.9,74.6C451.9,78.6,451.9,86.6,451.9,93.9C451.9,101.3,451.9,107.9,451.9,111.3L451.9,114.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dbdfd0-0)"></pa -50.6 -8,-50.6 -8,0" class="label-container" transform="translate(-81,25.3)"></polygon><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">Log the rule,</tspan><tspan x="0" y="2.1em">the count, the reason</tspan></text></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l4-outlier-decision-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822.8515625 864.4749755859375" style="width:100%;height:auto;max-width:823px;--dg-w:823px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="شجرة قرار لقيمة عددية علّمتها قاعدةٌ متطرفةً. ابدأ بالقيمة المعلَّمة واسأل أولًا السؤال الوحيد المهم: هل هذه القيمة ممكنة أصلًا في هذا العمود؟ فإن كانت مستحيلة فاسأل بعدها: هل الأرقام نفسها خاطئة أم الوحدة وحدها خاطئة؟ فالأرقام الخاطئة تجعلها خطأ قيمة، مثل الإيجار 99999 في الإعلان 5062 وهو رقم هاتف كُتب في خانة الإيجار، والعمل هو إفراغ الخلية إلى مفقود وترك قواعد الدرس الثاني تتولّى الثقب، مطبَّقًا على كل صف في الملف ومنه الصفوف المحجوزة، لأن إفراغ قيمة مستحيلة لا يتعلّم شيئًا من البيانات. والوحدة الخاطئة إصلاح آخر بعمل آخر: فالمساحات الخمس المسجَّلة بالدونم في الإعلانات 5015 و5099 و5167 و5290 و5403 تُقرأ من 0.0379 إلى 0.0878 بدل 37.9 إلى 87.8 مترًا مربعًا، والعمل هو الضرب في ألف وراء علم مَنشأ، فيستعيد خمسة صفوف حقيقية بدل حذفها. وإن كانت القيمة ممكنة فاسأل: هل يؤكّدها شيء من خارج العمود؟ فإن أكّدها المصدر أو الميدان فالقيمة نادرة لكنها حقيقية، مثل شقة الـ580 شيكلًا في مدينة غزة، والأعمال هي إبقاؤها أو تعليمها أو حذفها من صفوف التدريب وحدها، لا من الصفوف التي تُحكَم عليها بها قط. وإن لم يؤكّدها شيء فأنت لا تعرف من أي نوع هي، والعمل الأمين أن تعلّمها وتُبلّغ عنها وتسأل المصدر، لأن القاعدة لا تستطيع أن تفرّق القيمة النادرة من الخاطئة. وكل فرع ينتهي إلى الواجب نفسه: اكتب القرار وعدده في السجل."><title>شجرة قرار لقيمة عددية علّمتها قاعدةٌ متطرفةً. ابدأ بالقيمة المعلَّمة واسأل أولًا السؤال الوحيد المهم: هل هذه القيمة ممكنة أصلًا في هذا العمود؟ فإن كانت مستحيلة فاسأل بعدها: هل الأرقام نفسها خاطئة أم الوحدة
