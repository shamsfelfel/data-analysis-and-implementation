<div class="dg" data-diagram="t2-l5-encoder-choice"><div class="en"><svg id="dg-t2-l5-encoder-choice-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1614.09375 1103.543701171875" style="width:100%;height:auto;max-width:1615px;--dg-w:1615px;direction:ltr" data-wide="1" role="img" aria-label="Decision tree that chooses an encoder for one column from its measurement level. The first question is the measurement level written down in Theory 1 Lesson 2. If the column is an identifier, leave it out of the feature matrix, because it names one row and cannot generalise. If it is nominal, ask how many categories it has: up to about fifteen, one-hot encode it against a fitted category list; more than that, fold the rare levels into an Other bucket, or use a frequency encoding, and reach for target encoding only out of fold and only when the measurement says it helps. If it is ordinal, map the declared order to integer codes through an explicit ordered CategoricalDtype, never through cat.codes on an unordered category, because that numbers the levels alphabetically. If it is interval or ratio, keep the number and scale it, choosing min-max, standardisation or robust scaling by the shape of the column. Every branch ends at the same place: the category list, the code map and the scaler parameters are fitted on the training rows only, stored in the fitted dictionary, and applied unchanged to next month's file, where a value outside the fitted list is counted and reported rather than silently zeroed."><title>Decision tree that chooses an encoder for one column from its measurement level. The first question is the measurement level written down in Theory 1 Lesson 2. If the column is an identifier, leave it out of the feature matrix, because it names one row and cannot generalise. If it is nominal, ask how many categories it has: up to about fifteen, one-hot encode it against a fitted category list; more than that, fold the rare levels into an Other bucket, or use a frequency encoding, and reach for target encoding only out of fold and only when the measurement says it helps. If it is ordinal, map the declared order to integer codes through an explicit ordered CategoricalDtype, never through cat.codes on an unordered category, because that numbers the levels alphabetically. If it is interval or ratio, keep the number and scale it, choosing min-max, standardisation or robust scaling by the shape of the column. Every branch ends at the same place: the category list, the code map and the scaler parameters are fitted on the training rows only, stored in the fitted dictionary, and applied unchanged to next month's file, where a value outside the fitted list is counted and reported rather than silently zeroed.</title><g><marker id="da8b1a-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M854.4,41.5L854.3,45.4C854.2,49.3,854.1,57.2,854,64.4C853.9,71.7,853.9,78.3,853.9,81.7L853.9,85" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#da8b1a-0)"></path><path d="M938.2,208.3L1035,228.4C1131.9,248.6,1325.5,288.8,1422.4,326.9C1519.2,365,1519.2,400.9,1519.2,436.8C1519.2,472.7,1519.2,508.7,1519.2,545.4C1519.2,582.1,1519.2,619.6,1519.2,657.1C1519.2,694.6,1519.2,732.1,1519.2,756.3C1519.2,780.5,1519.2,791.3,1519.2,796.7L1519.2,802.1" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#da8b1a-0)"></path><path d="M770.4,209.1L679.2,229.1C588,249.1,405.6,289.1,314.4,314.5C223.2,339.9,223.2,350.8,223.2,356.2L223.2,361.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#da8b1a-0)"></path><path d="M792.4,231.1L767.4,247.4C742.5,263.7,692.6,296.4,667.7,330.7C642.7  ولا يعمّم. وإن كان اسميًّا فاسأل كم فئةً فيه: فإلى نحو خمس عشرة فئة رمّزه ترميزًا أحاديًّا على قائمة فئات مضبوطة؛ وإن زاد على ذلك فاجمع المستويات النادرة في دلو Other، أو استعمل ترميزًا بالتكرار، ولا تمدّ يدك إلى الترميز بالهدف إلا خارج الطيّة وإلا إذا قال القياس إنه يُفيد. وإن كان ترتيبيًّا فحوّل الترتيب المعلَن إلى رموز صحيحة بنوع CategoricalDtype مرتَّب صريح، لا بـ cat.codes على فئة غير مرتَّبة، لأن ذلك يرقّم المستويات أبجديًّا. وإن كان فتريًّا أو نسبيًّا فأبقِ الرقم ووحّد مقياسه، واختر بين الحدَّين والتوحيد المعياري والتوحيد الحصين بحسب شكل العمود. وكل فرع ينتهي إلى الموضع نفسه: فقائمة الفئات وخريطة الرموز ووسائط المُقايِس تُضبط على صفوف التدريب وحدها، وتُحفظ في قاموس الوسائط المضبوطة، وتُطبَّق دون تغيير على ملف الشهر القادم، حيث تُعَدّ القيمة الخارجة عن القائمة المضبوطة ويُبلَّغ عنها لا تُصفَّر بصمت."><title>شجرة قرار تختار مُرمِّزًا لعمود واحد انطلاقًا من مستوى قياسه. والسؤال الأول هو مستوى القياس الذي كُتب في الدرس 2 من النظري 1. فإن كان العمود معرّفًا فأخرِجه من مصفوفة الخصائص، لأنه يسمّي صفًّا واحدًا ولا يعمّم. وإن كان اسميًّا فاسأل كم فئةً فيه: فإلى نحو خمس عشرة فئة رمّزه ترميزًا أحاديًّا على قائمة فئات مضبوطة؛ وإن زاد على ذلك فاجمع المستويات النادرة في دلو Other، أو استعمل ترميزًا بالتكرار، ولا تمدّ يدك إلى الترميز بالهدف إلا خارج الطيّة وإلا إذا قال القياس إنه يُفيد. وإن كان ترتيبيًّا فحوّل الترتيب المعلَن إلى رموز صحيحة بنوع CategoricalDtype مرتَّب صريح، لا بـ cat.codes على فئة غير مرتَّبة، لأن ذلك يرقّم المستويات أبجديًّا. وإن كان فتريًّا أو نسبيًّا فأبقِ الرقم ووحّد مقياسه، واختر بين الحدَّين والتوحيد المعياري والتوحيد الحصين بحسب شكل العمود. وكل فرع ينتهي إلى الموضع نفسه: فقائمة الفئات وخريطة الرموز ووسائط المُقايِس تُضبط على صفوف التدريب وحدها، وتُحفظ في قاموس الوسائط المضبوطة، وتُطبَّق دون تغيير على ملف الشهر القادم، حيث تُعَدّ القيمة الخارجة عن القائمة المضبوطة ويُبلَّغ عنها لا تُصفَّر بصمت.</title><g><marker id="d65841-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="
