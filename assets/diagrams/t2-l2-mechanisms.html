<div class="dg" data-diagram="t2-l2-mechanisms"><div class="en"><svg id="dg-t2-l2-mechanisms-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763.30078125 777.1875" style="width:100%;height:auto;max-width:764px;--dg-w:764px;direction:ltr" data-wide="1" role="img" aria-label="Flowchart of the three missing-data mechanisms on the rental file. One question starts it: does whether the cell is blank depend on anything? If it depends on nothing, the mechanism is MCAR, the example is area_m2 with 27 blanks spread evenly, and a group median is safe. If it depends on a column you can see, the mechanism is MAR, the example is deposit with 123 blanks of which 103 belong to two agencies, and a rule per group is the right answer. If it depends on the hidden value itself, the mechanism is MNAR, the example is monthly_rent with 19 blanks on the dearest flats, and no imputation can recover it, so drop the row and go back to the source. A final note says the three can only be distinguished with knowledge of how the data was collected, never from the file alone."><title>Flowchart of the three missing-data mechanisms on the rental file. One question starts it: does whether the cell is blank depend on anything? If it depends on nothing, the mechanism is MCAR, the example is area_m2 with 27 blanks spread evenly, and a group median is safe. If it depends on a column you can see, the mechanism is MAR, the example is deposit with 123 blanks of which 103 belong to two agencies, and a rule per group is the right answer. If it depends on the hidden value itself, the mechanism is MNAR, the example is monthly_rent with 19 blanks on the dearest flats, and no imputation can recover it, so drop the row and go back to the source. A final note says the three can only be distinguished with knowledge of how the data was collected, never from the file alone.</title><g><marker id="dafb52-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" marke  اعتمد على القيمة المخفيّة نفسها فالآلية فقد غير عشوائي (MNAR)، ومثالها monthly_rent بتسعة عشر فراغًا على أغلى الشقق، ولا تعويض يستعيدها، فاحذف الصف وارجع إلى المصدر. وتقول ملاحظة أخيرة إن الثلاث لا تُفرَّق إلا بمعرفة كيف جُمعت البيانات، لا من الملف وحده."><title>مخطط انسيابي لآليات الفقد الثلاث في ملف الإيجارات. يبدأ بسؤال واحد: هل يعتمد كون الخلية فارغة على شيء؟ فإن لم يعتمد على شيء فالآلية فقد عشوائي تامّ (MCAR)، ومثالها area_m2 بسبعة وعشرين فراغًا موزّعة بانتظام، ووسيط المجموعة آمن. وإن اعتمد على عمود تراه فالآلية فقد عشوائي مشروط (MAR)، ومثالها deposit بمئة وثلاثة وعشرين فراغًا منها مئة وثلاثة لوكالتين، والقاعدة لكل مجموعة هي الجواب الصحيح. وإن اعتمد على القيمة المخفيّة نفسها فالآلية فقد غير عشوائي (MNAR)، ومثالها monthly_rent بتسعة عشر فراغًا على أغلى الشقق، ولا تعويض يستعيدها، فاحذف الصف وارجع إلى المصدر. وتقول ملاحظة أخيرة إن الثلاث لا تُفرَّق إلا بمعرفة كيف جُمعت البيانات، لا من الملف وحده.</title><g><marker id="db8d3b-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M373.1,41.5L373,45.4C373,49.3,372.8,57.2,372.7,64.4C372.6,71.7,372.6,78.3,372.6,81.7L372.6,85" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#db8d3b-0)"></path><path d="M309.3,220.4L278.4,237C247.5,253.6,185.6,286.9,154.7,309C123.8,331,123.8,341.8,123.8,347.3L123.8,352.7" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#db8d3b-0)"></path><path d="M372.6,283.7L372.6,289.8C372.6,295.8,372.6,308,372.6,319.5C372.6,331,372.6,341.8,372.6,347.3L372.6,352.7" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#db8d3b-0)"></path><path d="M433.9,222.4L461.5,238.7C489.2,255,544.5,287.6,572.1,309.3C599.8,331,599.8,341.8,599.8,347.3L599.8,352.
