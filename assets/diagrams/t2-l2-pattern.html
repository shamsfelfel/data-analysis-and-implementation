<div class="dg" data-diagram="t2-l2-pattern"><div class="en"><svg id="dg-t2-l2-pattern-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271.453125 969" style="width:100%;height:auto;max-width:272px;--dg-w:272px;direction:ltr" role="img" aria-label="Flowchart of the four questions that turn a count of blanks into a pattern. Step one counts blanks per column and gives five numbers: 19 rents, 27 areas, 9 floors, 36 conditions, 123 deposits. Step two counts blanks per row and shows that 329 rows are complete, 139 have one blank, 30 have two and 5 have three. Step three asks which columns go blank together and finds that every blank rent also has a blank deposit. Step four crosses the blank flag against another column and finds that the deposit is blank for every row of two agencies. The conclusion is that a count is one number per column while a pattern is a table, and only the table tells you which mechanism you are looking at."><title>Flowchart of the four questions that turn a count of blanks into a pattern. Step one counts blanks per column and gives five numbers: 19 rents, 27 areas, 9 floors, 36 conditions, 123 deposits. Step two counts blanks per row and shows that 329 rows are complete, 139 have one blank, 30 have two and 5 have three. Step three asks which columns go blank together and finds that every blank rent also has a blank deposit. Step four crosses the blank flag against another column and finds that the deposit is blank for every row of two agencies. The conclusion is that a count is one number per column while a pattern is a table, and only the table tells you which mechanism you are looking at.</title><g><marker id="d28125-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters" t></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l2-pattern-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265.296875 951.3999633789062" style="width:100%;height:auto;max-width:266px;--dg-w:266px;direction:rtl;text-anchor:end" role="img" aria-label="مخطط انسيابي للأسئلة الأربعة التي تحوّل عدّ الفراغات إلى نمط. الخطوة الأولى تعدّ الفراغات لكل عمود فتعطي خمسة أرقام: تسعة عشر إيجارًا، وسبعًا وعشرين مساحة، وتسعة طوابق، وستًّا وثلاثين حالة، ومئة وثلاثة وعشرين تأمينًا. والخطوة الثانية تعدّ الفراغات لكل صف فتُبيّن أن 329 صفًّا كاملة، و139 فيها فراغ واحد، و30 فيها اثنان، وخمسة فيها ثلاثة. والخطوة الثالثة تسأل أي الأعمدة تفرغ معًا فتجد أن كل إيجار فارغ معه تأمين فارغ. والخطوة الرابعة تُقاطِع عَلَم الفراغ بعمود آخر فتجد أن التأمين فارغ في كل صفوف وكالتين. والخلاصة أن العدّ رقم واحد لكل عمود، أما النمط فجدول، والجدول وحده يقول لك أي آلية تنظر إليها."><title>مخطط انسيابي للأسئلة الأربعة التي تحوّل عدّ الفراغات إلى نمط. الخطوة الأولى تعدّ الفراغات لكل عمود فتعطي خمسة أرقام: تسعة عشر إيجارًا، وسبعًا وعشرين مساحة، وتسعة طوابق، وستًّا وثلاثين حالة، ومئة وثلاثة وعشرين تأمينًا. والخطوة الثانية تعدّ الفراغات لكل صف فتُبيّن أن 329 صفًّا كاملة، و139 فيها فراغ واحد، و30 فيها اثنان، وخمسة فيها ثلاثة. والخطوة الثالثة تسأل أي الأعمدة تفرغ معًا فتجد أن كل إيجار فارغ معه تأمين فارغ. والخطوة الرابعة تُقاطِع عَلَم الفراغ بعمود آخر فتجد أن التأمين فارغ في كل صفوف وكالتين. والخلاصة أن العدّ رقم واحد لكل عمود، أما النمط فجدول، والجدول وحده يقول لك أي آلية تنظر إليها.</title><g><marker id="d865d9-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M132.6,70.6L132.6,74.6C132.6,78.6,132.6,86.6,132.6,93.9C132.6,101.3,132.6,107.9,132.6,111.3L132.6,114.6" class="edge-thickne
