<div class="dg" data-diagram="t2-l1-transform-vs-aggregate"><div class="en"><svg id="dg-t2-l1-transform-vs-aggregate-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494.73046875 707.2468872070312" style="width:100%;height:auto;max-width:495px;--dg-w:495px;direction:ltr" role="img" aria-label="Flowchart contrasting a transformation with an aggregation. A table of 503 listings, one row per listing, goes two ways. Down the transformation branch, filling a blank rent or encoding a city returns a table whose rows are still listings, so 503 rows in gives 503 rows out and the listing_id still identifies a row; the result can be fed to the next step or to a model. Down the aggregation branch, grouping by city and taking the mean rent returns a table whose rows are cities, so 503 rows in gives 5 rows out and the listing_id is gone; the result is a report or a chart, and the individual listing cannot be recovered from it."><title>Flowchart contrasting a transformation with an aggregation. A table of 503 listings, one row per listing, goes two ways. Down the transformation branch, filling a blank rent or encoding a city returns a table whose rows are still listings, so 503 rows in gives 503 rows out and the listing_id still identifies a row; the result can be fed to the next step or to a model. Down the aggregation branch, grouping by city and taking the mean rent returns a table whose rows are cities, so 503 rows in gives 5 rows out and the listing_id is gone; the result is a report or a chart, and the individual listing cannot be recovered from it.</title><g><marker id="dcbf65-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M261.4,70.6L261.4,74.6C261.4,78.6,2 فوف خارجة ويبقى listing_id معرِّفًا للصف؛ وتصلح النتيجة لتغذية الخطوة التالية أو النموذج. وفي فرع التجميع، التجميع بالمدينة وأخذ متوسط الإيجار يعيد جدولًا صفوفه مدن، فـ503 صفوف داخلة تعطي 5 صفوف خارجة ويزول listing_id؛ والنتيجة تقرير أو رسم، ولا يمكن استرجاع الإعلان المفرد منها."><title>مخطط انسيابي يقابل بين التحويل والتجميع. جدول فيه 503 إعلانات، صفٌّ لكل إعلان، يسلك طريقين. في فرع التحويل، تعبئة إيجار فارغ أو ترميز مدينة يعيد جدولًا صفوفه ما زالت إعلانات، فـ503 صفوف داخلة تعطي 503 صفوف خارجة ويبقى listing_id معرِّفًا للصف؛ وتصلح النتيجة لتغذية الخطوة التالية أو النموذج. وفي فرع التجميع، التجميع بالمدينة وأخذ متوسط الإيجار يعيد جدولًا صفوفه مدن، فـ503 صفوف داخلة تعطي 5 صفوف خارجة ويزول listing_id؛ والنتيجة تقرير أو رسم، ولا يمكن استرجاع الإعلان المفرد منها.</title><g><marker id="d71d5c-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M250.7,70.6L250.7,74.6C250.7,78.6,250.7,86.6,250.7,93.9C250.7,101.3,250.7,107.9,250.7,111.3L250.7,114.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d71d5c-0)"></path><path d="M202.8,280L190.9,294.1C179,308.1,155.2,336.3,143.3,355.8C131.3,375.3,131.3,386.1,131.3,391.5L131.3,397" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d71d5c-0)"></path><path d="M131.3,481.2L131.3,485.2C131.3,489.2,131.3,497.2,131.3,506C131.3,514.8,131.3,524.4,131.3,529.2L131.3,534" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d71d5c-0)"></path><path d="M131.3,600.6L131.3,606C131.3,611.5,131.3,622.4,131.3,631.2C131.3,640,131.3,646.7,131.3,650L131.3,653.4" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d71d5c-0)"></path><path d="M298.7,280L310.6,294.1C3
