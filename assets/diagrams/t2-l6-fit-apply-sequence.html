<div class="dg" data-diagram="t2-l6-fit-apply-sequence"><div class="en"><svg id="dg-t2-l6-fit-apply-sequence-en" data-t="sequence" xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 1245 1095" style="width:100%;height:auto;max-width:1245px;--dg-w:1245px;direction:ltr" data-wide="1" role="img" aria-label="Sequence diagram of one month of a fitted pipeline, with five participants: the analyst, the March batch, the transform, the stored fitted artefact and the June batch. In March the analyst calls transform_listings on the training rows with no fitted dictionary. The transform runs stages one and two, which learn nothing, then measures every parameter it needs on those rows only: the medians and the mode of stage three, the median and the MAD and the fence of stage four, and the category lists, the column order and the scaler extremes of stage five. It writes those seventeen parameters into the fitted dictionary, hands the analyst a matrix and a report, and the analyst stores the dictionary beside the matrix with a date on it. In June the analyst loads the same artefact and calls the same function with it. The transform now learns nothing at all: it reads each parameter out of the dictionary, applies it unchanged, and reports what it could not recognise, namely two Beit Lahia listings whose city is not on the fitted list. Three assertions then check the row count, the blank cells and the column set before anything is returned. The last exchange is the warning: if June had refitted, the two matrices would carry different numbers for a reason that has nothing to do with any flat, and the two months would not be comparable."><title>Sequence diagram of one month of a fitted pipeline, with five participants: the analyst, the March batch, the transform, the stored fitted artefact and the June batch. In March the analyst calls transform_listings on the training rows with no fitted dictionary. The transform runs stages one and two, which learn nothing, then measures every parameter it needs on those rows only: the medians and the mode of stage three, the median and the MAD and the fence of stage four, and the category lists, the column order and the scaler extremes of stage five. It writes those seventeen parameters into the fitted dictionary, hands the analyst a matrix and a report, and the analyst stores the dictionary beside the matrix with a date on it. In June the analyst loads the same artefact and calls the same function with it. The transform now learns nothing at all: it reads each parameter out of the dictionary, applies it unchanged, and reports what it could not recognise, namely two Beit Lahia listings whose city is not on the fitted list. Three assertions then check the row count, the blank cells and the column set before anything is returned. The last exchange is the warning: if June had refitted, the two matrices would carry different numbers for a reason that has nothing to do with any flat, and the two months would not be comparable.</title><rect x="995" y="1009" width="150" height="44" name="Jun" rx="3" ry="3" class="actor actor-bottom"></rect><text x="1070" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="1070" dy="-8">June batch</tspan></text><text x="1070" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="1070" dy="8">85 rows</tspan></text><rect x="805" y="1009" width="150" height="44" name="F" rx="3" ry="3" class="actor actor-bottom"></rect><text x="880" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="880" dy="-8">fitted artefact</tspan></text><text x="880" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="880" dy="8">(dated, on disk)</tspan></text><rect x="461" y="1009" width="150" height="44" name= رأ كل وسيط من القاموس ويطبّقه بلا تغيير، ويبلّغ عمّا لم يتعرّف عليه، أي إعلانَي بيت لاهيا اللذين ليست مدينتهما في القائمة المضبوطة. ثم تفحص ثلاثة تأكيدات عددَ الصفوف والخلايا الفارغة ومجموعة الأعمدة قبل أن يُرجَع أي شيء. والتبادل الأخير هو التحذير: لو أعاد حزيران الضبط لحملت المصفوفتان أرقامًا مختلفة لسبب لا علاقة له بأي شقة، ولما كان الشهران قابلين للمقارنة."><title>مخطط تتابع لشهر واحد من خط مضبوط الوسائط، وفيه خمسة مشاركين: المحلّل، ودفعة آذار، والتحويل، وأثر fitted المحفوظ، ودفعة حزيران. في آذار ينادي المحلّل transform_listings على صفوف التدريب دون قاموس وسائط. فيشغّل التحويل المرحلتين 1 و2 وهما لا تتعلّمان شيئًا، ثم يقيس كل وسيط يحتاجه على تلك الصفوف وحدها: وسائط المرحلة 3 ومنوالها، ووسيط المرحلة 4 وانحرافها المطلق المتوسط وسياجها، وقوائم فئات المرحلة 5 وترتيب أعمدتها وحدّي مقياسها. ثم يكتب تلك السبعة عشر وسيطًا في قاموس fitted، ويسلّم المحلّل مصفوفةً وتقريرًا، ويحفظ المحلّل القاموس بجانب المصفوفة وعليه تاريخ. وفي حزيران يحمّل المحلّل الأثر نفسه وينادي الدالة نفسها به. فلا يتعلّم التحويل شيئًا على الإطلاق: يقرأ كل وسيط من القاموس ويطبّقه بلا تغيير، ويبلّغ عمّا لم يتعرّف عليه، أي إعلانَي بيت لاهيا اللذين ليست مدينتهما في القائمة المضبوطة. ثم تفحص ثلاثة تأكيدات عددَ الصفوف والخلايا الفارغة ومجموعة الأعمدة قبل أن يُرجَع أي شيء. والتبادل الأخير هو التحذير: لو أعاد حزيران الضبط لحملت المصفوفتان أرقامًا مختلفة لسبب لا علاقة له بأي شقة، ولما كان الشهران قابلين للمقارنة.</title><rect x="913" y="1009" width="150" height="44" name="Jun" rx="3" ry="3" class="actor actor-bottom"></rect><text x="988" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="988" dy="-8">دفعة حزيران</tspan></text><text x="988" y="1031" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="988" dy="8">‏85 صفًّا</tspan></text><rect x="723" y="1009" width="150" height="44" name="F" rx="3" ry="3" class="actor actor-bottom"></rect><text x="798" y="1031" dominant
