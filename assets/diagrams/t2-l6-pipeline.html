<div class="dg" data-diagram="t2-l6-pipeline"><div class="en"><svg id="dg-t2-l6-pipeline-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.000003814697265625 690.0746459960938 1400.9647216796875" style="width:100%;height:auto;max-width:691px;--dg-w:691px;direction:ltr" data-wide="1" role="img" aria-label="Flowchart of the assembled transformation pipeline. One raw CSV enters at the top. Stage 2 parses the two date formats first, because the deduplication of stage 1 needs a sortable date to choose which copy of a repost survives. Stage 1 then makes one row per flat, taking 503 rows to 480. Stage 2 proper applies the recorded maps: CITY_MAP for twenty-six city spellings, BOOL_MAP for the twelve ways of writing furnished, FLOOR_WORDS for the nineteen ground floors, the declared condition order, the six advert flags, the dunum unit repair and the LIMITS domain rule, and then joins city_reference with validate equals m colon 1. Stage 3 decides every hole by its mechanism: the unlabelled rows are flagged and never filled, the area takes a median per rooms, the rooms and the condition take the training median and mode, and the deposit takes months of rent per agency. Stage 4 flags the fence, the robust z and the odd deposit ratio, and deletes nothing. Stage 5 encodes and scales against fitted category lists and scaler parameters, producing an eighteen-column matrix. Two things leave the pipeline beside the matrix: a report with one row per step, and the fitted dictionary, which is the only thing the next month's run is allowed to reuse. Three assertions guard the exit: the row count must equal the row count out of stage 1, no required column may contain a blank, and the column set must equal the fitted one."><title>Flowchart of the assembled transformation pipeline. One raw CSV enters at the top. Stage 2 parses the two date formats first, because the deduplication of stage 1 needs a sortable date to choose which copy of a repost survives. Stage 1 then makes one row per flat, taking 503 rows to 480. Stage 2 proper applies the recorded maps: CITY_MAP for twenty-six city spellings, BOOL_MAP for the twelve ways of writing furnished, FLOOR_WORDS for the nineteen ground floors, the declared condition order, the six advert flags, the dunum unit repair and the LIMITS domain rule, and then joins city_reference with validate equals m colon 1. Stage 3 decides every hole by its mechanism: the unlabelled rows are flagged and never filled, the area takes a median per rooms, the rooms and the condition take the training median and mode, and the deposit takes months of rent per agency. Stage 4 flags the fence, the robust z and the odd deposit ratio, and deletes nothing. Stage 5 encodes and scales against fitted category lists and scaler parameters, producing an eighteen-column matrix. Two things leave the pipeline beside the matrix: a report with one row per step, and the fitted dictionary, which is the only thing the next month's run is allowed to reuse. Three assertions guard the exit: the row count must equal the row count out of stage 1, no required column may contain a blank, and the column set must equal the fitted one.</title><g><marker id="d189a3-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M526.9,95.1L526.9,99.1C526.9,103.1,526.9,111.1,526.9,118.5C526.9,125.8,526.9,132.5,526.9,135.8L526.9,139.1" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d189a3-0)"></path><path d="M449,205.7L439.1,209.7C429.1,213.7,409.2,221.7,399.2,229.1C389.3,236.4,389.3,243.1,389.3,246.4L389.3,249.7" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d189a3-0)"></path><path d="M389.3,33 ل ثقب بآليته: الصفوف غير المعنونة تُعلَّم ولا تُعبَّأ قط، والمساحة تأخذ وسيط فئتها حسب الغرف، والغرف والحالة تأخذان وسيط التدريب ومنواله، والتأمين يأخذ عدد أشهر الإيجار حسب الوكالة. وتعلّم المرحلة 4 السياج وz الحصينة ونسبة التأمين الشاذة، ولا تحذف شيئًا. وترمّز المرحلة 5 وتوحّد المقياس على قوائم الفئات ووسائط المقايسة المضبوطة، فتنتج مصفوفة من ثمانية عشر عمودًا. ويخرج من الخط شيئان مع المصفوفة: تقرير بسطر لكل خطوة، وقاموس fitted، وهو الشيء الوحيد الذي يُسمح لتشغيل الشهر القادم بإعادة استعماله. وثلاثة تأكيدات تحرس المخرج: عدد الصفوف يجب أن يساوي عدد الصفوف الخارج من المرحلة 1، ولا يحقّ لعمود مطلوب أن يحمل خلية فارغة، ومجموعة الأعمدة يجب أن تساوي المضبوطة."><title>مخطط انسيابي لخط التحويل المجمَّع. يدخل ملف CSV خام واحد من الأعلى. تُحلَّل صيغتا التاريخ أولًا، وهي من المرحلة 2، لأن إزالة التكرار في المرحلة 1 تحتاج تاريخًا قابلًا للترتيب لتختار أي نسخة من الإعلان المعاد نشره تبقى. ثم تجعل المرحلة 1 صفًّا واحدًا لكل شقة، فتنزل 503 صفوف إلى 480. ثم تطبّق المرحلة 2 خرائطها المسجَّلة: CITY_MAP لستٍّ وعشرين صورة إملائية للمدن، وBOOL_MAP للصور الاثنتي عشرة لكتابة الفرش، وFLOOR_WORDS للطوابق الأرضية التسعة عشر، وترتيب الحالة المعلَن، وأعلام الإعلان الستة، وإصلاح وحدة الدونم، وقاعدة LIMITS الميدانية، ثم تدمج city_reference بـ validate يساوي m:1. وتقرّر المرحلة 3 كل ثقب بآليته: الصفوف غير المعنونة تُعلَّم ولا تُعبَّأ قط، والمساحة تأخذ وسيط فئتها حسب الغرف، والغرف والحالة تأخذان وسيط التدريب ومنواله، والتأمين يأخذ عدد أشهر الإيجار حسب الوكالة. وتعلّم المرحلة 4 السياج وz الحصينة ونسبة التأمين الشاذة، ولا تحذف شيئًا. وترمّز المرحلة 5 وتوحّد المقياس على قوائم الفئات ووسائط المقايسة المضبوطة، فتنتج مصفوفة من ثمانية عشر عمودًا. ويخرج من الخط شيئان مع المصفوفة: تقرير بسطر لكل خطوة، وقاموس fitted، وهو الشيء الوحيد الذي يُسمح لتشغيل الشهر القادم بإعادة استعماله. وثلاثة تأكيدات تحرس المخرج: عدد الصفوف يجب أن يساوي عدد الصفوف الخارج من المرحلة 1، ولا يحقّ لعمود مطلوب أن يحمل خلية فارغة، ومجموعة الأعمدة يجب أن تساوي المضبوطة.</title><g><marker id="d1278c-0" class="marker flowchart-v2" viewB
