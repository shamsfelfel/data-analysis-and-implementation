<div class="dg" data-diagram="t2-l5-onehot-shape"><div class="en"><svg id="dg-t2-l5-onehot-shape-en" data-t="sequence" xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 1162 1361" style="width:100%;height:auto;max-width:1162px;--dg-w:1162px;direction:ltr" data-wide="1" role="img" aria-label="A sequence diagram of the four exchanges that decide the shape of a one-hot matrix. The participants are the March file of 480 flats, the encoder, the stored fitted dictionary, the June file of 85 listings, and the model. In the first exchange the naive code asks get_dummies for a matrix of March and gets 480 by 25, then asks for a matrix of June and gets 85 by 19, and the model refuses the June matrix because the widths do not match. In the second exchange the code concatenates the two files and encodes them together, which does produce one matrix of 565 by 29, but June's rents have now helped choose March's columns, and a file that has not arrived yet is still unencodable. In the third exchange the encoder is fitted on March alone: it stores the twenty-five column names in the fitted dictionary, and June is encoded and then reindexed against those stored names, so June comes back as 85 by 25 and the model accepts it. In the fourth exchange the apply step also compares June's values against the stored category list before encoding, and returns a log row saying Beit Lahia equals two and three agencies unseen, so the five all-zero rows are counted and named instead of being silently zeroed."><title>A sequence diagram of the four exchanges that decide the shape of a one-hot matrix. The participants are the March file of 480 flats, the encoder, the stored fitted dictionary, the June file of 85 listings, and the model. In the first exchange the naive code asks get_dummies for a matrix of March and gets 480 by 25, then asks for a matrix of June and gets 85 by 19, and the model refuses the June matrix because the widths do not match. In the second exchange the code concatenates the two files and encodes them together, which does produce one matrix of 565 by 29, but June's rents have now helped choose March's columns, and a file that has not arrived yet is still unencodable. In the third exchange the encoder is fitted on March alone: it stores the twenty-five column names in the fitted dictionary, and June is encoded and then reindexed against those stored names, so June comes back as 85 by 25 and the model accepts it. In the fourth exchange the apply step also compares June's values against the stored category list before encoding, and returns a log row saying Beit Lahia equals two and three agencies unseen, so the five all-zero rows are counted and named instead of being silently zeroed.</title><rect x="912" y="1296" width="150" height="44" name="D" rx="3" ry="3" class="actor actor-bottom"></rect><text x="987" y="1318" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="987" dy="0">Model</tspan></text><rect x="722" y="1296" width="150" height="44" name="J" rx="3" ry="3" class="actor actor-bottom"></rect><text x="797" y="1318" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="797" dy="0">June (85 rows)</tspan></text><rect x="532" y="1296" width="150" height="44" name="S" rx="3" ry="3" class="actor actor-bottom"></rect><text x="607" y="1318" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="607" dy="0">fitted</tspan></text><rect x="247" y="1296" width="150" height="44" name="E" rx="3" ry="3" class="actor actor-bottom"></rect><text x="322" y="1318" dominant-baseline="central" class="actor actor-box" style="text-anchor:middle;font-size:16px;font-weight:400"><tspan x="322" dy="0">Encoder</tspan></text><rect x="0" y="1296" width="150" height="44" name="M" rx="3" ry="3" class="actor actor-bottom"></rect><text x="75" y="1318" dominant-baseline="c max-width:1170px;--dg-w:1170px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="مخطط تسلسلي للتبادلات الأربعة التي تحدّد شكل مصفوفة الترميز الأحادي. والمشاركون هم ملف آذار بـ480 شقة، والمُرمِّز، وقاموس الوسائط المضبوطة المحفوظ، وملف حزيران بـ85 إعلانًا، والنموذج. في التبادل الأول يطلب الكود الساذج من get_dummies مصفوفةً لآذار فيحصل على 480 في 25، ثم يطلب مصفوفةً لحزيران فيحصل على 85 في 19، فيرفض النموذج مصفوفة حزيران لأن العرضين لا يتطابقان. وفي التبادل الثاني يدمج الكود الملفين ويرمّزهما معًا، وهذا ينتج مصفوفة واحدة 565 في 29 فعلًا، لكن إيجارات حزيران قد ساعدت الآن في اختيار أعمدة آذار، ويبقى ملفٌ لم يصل بعد غير قابل للترميز. وفي التبادل الثالث يُضبط المُرمِّز على آذار وحده: فيحفظ أسماء الأعمدة الخمسة والعشرين في قاموس الوسائط، ويُرمَّز حزيران ثم تُعاد فهرسته على تلك الأسماء المحفوظة، فيعود حزيران 85 في 25 ويقبله النموذج. وفي التبادل الرابع تقارن خطوة التطبيق أيضًا قيم حزيران بقائمة الفئات المحفوظة قبل الترميز، وتعيد سطر سجل يقول «بيت لاهيا = 2 وثلاث وكالات غير مرئية»، فتُعَدّ الصفوف الصفرية الخمسة وتُسمَّى بدل أن تُصفَّر بصمت."><title>مخطط تسلسلي للتبادلات الأربعة التي تحدّد شكل مصفوفة الترميز الأحادي. والمشاركون هم ملف آذار بـ480 شقة، والمُرمِّز، وقاموس الوسائط المضبوطة المحفوظ، وملف حزيران بـ85 إعلانًا، والنموذج. في التبادل الأول يطلب الكود الساذج من get_dummies مصفوفةً لآذار فيحصل على 480 في 25، ثم يطلب مصفوفةً لحزيران فيحصل على 85 في 19، فيرفض النموذج مصفوفة حزيران لأن العرضين لا يتطابقان. وفي التبادل الثاني يدمج الكود الملفين ويرمّزهما معًا، وهذا ينتج مصفوفة واحدة 565 في 29 فعلًا، لكن إيجارات حزيران قد ساعدت الآن في اختيار أعمدة آذار، ويبقى ملفٌ لم يصل بعد غير قابل للترميز. وفي التبادل الثالث يُضبط المُرمِّز على آذار وحده: فيحفظ أسماء الأعمدة الخمسة والعشرين في قاموس الوسائط، ويُرمَّز حزيران ثم تُعاد فهرسته على تلك الأسماء المحفوظة، فيعود حزيران 85 في 25 ويقبله النموذج. وفي التبادل الرابع تقارن خطوة التطبيق أيضًا قيم حزيران بقائمة الفئات المحفوظة قبل الترميز، وتعيد سطر سجل يقول «بيت لاهيا = 2 وثلاث وكالات غير مرئية»، فتُعَدّ الصفوف الصفرية
