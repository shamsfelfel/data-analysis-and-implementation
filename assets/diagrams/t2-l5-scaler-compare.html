<div class="dg" data-diagram="t2-l5-scaler-compare"><div class="en"><svg id="dg-t2-l5-scaler-compare-en" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1481.3359375 675.390625" style="width:100%;height:auto;max-width:1482px;--dg-w:1482px;direction:ltr" data-wide="1" role="img" aria-label="A flowchart comparing three scalers on the same rent column, before and after the value repair. One column of 461 rents enters, containing a 99999 that is really a phone number and a 25 that is really a daily rate. On the unrepaired column, min-max scaling divides by a range of 99974, so 460 of the 461 rents land below 0.01 and the quartiles are 0.0013, 0.00175 and 0.0023; standardisation divides by a standard deviation of 4648, so every real rent sits in a band 0.12 standard deviations wide, between minus 0.087 and plus 0.033, while the typo sits at 21.4; robust scaling divides by the interquartile range of 100, so the body of the column is unharmed with quartiles at minus 0.45, zero and 0.55, and the typo is pushed out to 997.99 where you can see it. After the LIMITS rule of Lesson 4 voids both, min-max gives quartiles of 0.20, 0.28 and 0.39, standardisation gives minus 0.69, minus 0.14 and 0.54 with a true mean of zero and standard deviation of one, and robust scaling gives exactly the same quartiles as before, because the median and the interquartile range never saw either bad value. The conclusion is that scaling is stage five and the value repair is stage two, and that a robust scaler is the one that fails visibly rather than quietly."><title>A flowchart comparing three scalers on the same rent column, before and after the value repair. One column of 461 rents enters, containing a 99999 that is really a phone number and a 25 that is really a daily rate. On the unrepaired column, min-max scaling divides by a range of 99974, so 460 of the 461 rents land below 0.01 and the quartiles are 0.0013, 0.00175 and 0.0023; standardisation divides by a standard deviation of 4648, so every real rent sits in a band 0.12 standard deviations wide, between minus 0.087 and plus 0.033, while the typo sits at 21.4; robust scaling divides by the interquartile range of 100, so the body of the column is unharmed with quartiles at minus 0.45, zero and 0.55, and the typo is pushed out to 997.99 where you can see it. After the LIMITS rule of Lesson 4 voids both, min-max gives quartiles of 0.20, 0.28 and 0.39, standardisation gives minus 0.69, minus 0.14 and 0.54 with a true mean of zero and standard deviation of one, and robust scaling gives exactly the same quartiles as before, because the median and the interquartile range never saw either bad value. The conclusion is that scaling is stage five and the value repair is stage two, and that a robust scaler is the one that fails visibly rather than quietly.</title><g><marker id="d61dba-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M751.8,59.1L751.7,63C751.6,66.9,751.4,74.8,751.4,82C751.3,89.3,751.3,95.9,751.3,99.3L751.3,102.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d61dba-0)"></path><path d="M667.4,226.7L574.7,246.8C482.1,266.9,296.7,307,204,332.4C111.3,357.9,111.3,368.8,111.3,374.2L111.3,379.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d61dba-0)"></path><path d="M675.7,235L622.3,253.7C568.9,272.4,462.1,309.7,408.7,333.8C355.3,357.9,355.3,368.8,355.3,374.2L355.3,379.6" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#d61dba-0)"></path><path d="M700.5,259.9L686.2,274.4C671.8,288.9,643,318,628.6,338C614.3,357.9,614.3,368.8,614.3,374.2L614.3,379.6" class="edge-thickness-normal edge-pattern-so ight="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">robust: IQR 100</tspan><tspan x="0" y="2.1em">quartiles unchanged</tspan></text></g></g><g class="node default dg-bad" transform="translate(233.3,525.5)"><rect class="basic label-container" x="-96.3" y="-31.3" width="192.6" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">Feature destroyed:</tspan><tspan x="0" y="2.1em">no error, no warning</tspan></text></g></g><g class="node default dg-warn" transform="translate(614.3,525.5)"><rect class="basic label-container" x="-100.7" y="-31.3" width="201.5" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">Feature survived,</tspan><tspan x="0" y="2.1em">and the typo is visible</tspan></text></g></g><g class="node default dg-good" transform="translate(1142.7,525.5)"><rect class="basic label-container" x="-74.9" y="-22.5" width="149.9" height="45"></rect><g class="label" transform="translate(0,-10.5)"><text><tspan x="0" y="1em">Usable feature</tspan></text></g></g><g class="node default dg-hl" transform="translate(362.8,636.1)"><rect class="basic label-container" x="-114.5" y="-31.3" width="229" height="62.6"></rect><g class="label" transform="translate(0,-19.3)"><text><tspan x="0" y="1em">Repair values (stage 2)</tspan><tspan x="0" y="2.1em">before you scale (stage 5)</tspan></text></g></g></g></g></g></svg></div><div class="ar"><svg id="dg-t2-l5-scaler-compare-ar" class="flowchart" data-t="flowchart-v2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1573.34375 674.6875" style="width:100%;height:auto;max-width:1574px;--dg-w:1574px;direction:rtl;text-anchor:end" data-wide="1" role="img" aria-label="مخطط يقارن ثلاثة مُقايِسات على عمود الإيجار نفسه قبل إصلاح القيم وبعده. يدخل عمود واحد فيه 461 إيجارًا، ومنها 99999 وهي في الحقيقة رقم هاتف و25 وهي في الحقيقة أجرة يوم. فعلى العمود غير المُصلَح يقسم توحيد الحدَّين على مدى يساوي 99974، فيهبط 460 من ا
