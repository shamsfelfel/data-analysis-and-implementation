n this file a careless key of city plus rooms plus rent keeps four hundred and thirteen rows and destroys sixty-seven real flats. If the key is equal but other columns are not, the pair is a repost: the same flat advertised again with a later date and the advert retyped. Nine rows of the file are of this kind and drop_duplicates cannot see any of them. Then one judgement remains, which is which copy survives, and it is a decision about the question rather than about the data. Keep the latest if you want the current state of the market, keep the earliest if you want the date the flat first came up, and keep both if a repost is itself the thing you are counting. In every branch, log the count and the rule, because a row count alone cannot tell the three branches apart.</title><g><marker id="dd2c8d-0" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowMarkerPath" style="stroke-width:1;stroke-dasharray:1, 0"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M404.3,53L404.3,57C404.3,61,404.3,69,404.3,76.3C404.3,83.7,404.3,90.3,404.3,93.7L404.3,97" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dd2c8d-0)"></path><path d="M333.3,235.5L293.2,253.4C253.2,271.3,173.1,307.2,133,345.6C93,384,93,425,93,466C93,507.1,93,548.1,93,579.9C93,611.7,93,634.3,93,654.8C93,675.3,93,693.8,93,720.2C93,746.6,93,781,93,798.3L93,815.5" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dd2c8d-0)"></path><path d="M93,882.1L93,902C93,922,93,961.9,93,987.3C93,1012.7,93,1023.5,93,1028.9L93,1034.3" class="edge-thickness-normal edge-pattern-solid flowchart-link" marker-end="url(#dd2c8d-0)"></path><path d="M451.3,259.5L463,273.4C474.7,287.3,498.1,315.2,509.8,334.5C521.5,353.8,521.5,364.7,521.5,370.1L521.5,375.5" class="edge-thickness-normal edge-pattern-solid flowchart-link" m
